[project]
name = "sadt-mri2cbct"
version = "0.1.0"
description = "Bring a TMJ MRI into its CBCT's space, one pipeline step at a time."
# 3.11 is the deployment image's interpreter (lab-ai:2026.08, python 3.11.13).
requires-python = ">=3.11,<3.12"
# Pinned to the stack the deployed server runs, not to upstream's declared
# torch 2.2.0+cu118 / nnunetv2 2.8.0: the first is installed by a hand-rolled
# `pip_install("torch==2.2.0 --index-url .../cu118")` that fights the deployed
# cu128 wheels, and the second is declared as ('nnunet_version', "==2.8.0"),
# which names no package that exists. See README.
dependencies = [
    "torch==2.8.0",
    "nnunetv2==2.8.1",
    # The Slicer module never declares this one, and MRI2CBCT_CLI imports it at
    # module level: a deployment without it fails at the first approximation.
    "torchreg==0.1.3",
    "itk==5.4.7",
    # The registration itself. Upstream pip-installs it from the module and
    # pins nothing.
    "itk-elastix==0.25.4",
    "SimpleITK==2.5.6",
    "nibabel==5.4.2",
    "numpy==2.3.2",
    "pandas==2.3.3",
    "scipy==1.16.2",
    "scikit-learn==1.7.2",
]

# What makes this directory a tool.
[tool.sadt]
tool = true
name = "MRI2CBCT"

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_mri2cbct"]

# `explicit` is load-bearing: without it uv looks for EVERY package on the
# PyTorch index, and most of them are not there.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
sadt-testkit = { path = "../../testkit", editable = true }
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device. Skipped in CI (`-m 'not gpu'`); run it by hand and report the result in the PR.",
    "models: needs the real nnUNet condyle bundle and is skipped without it. See tests/data/README.md.",
]
