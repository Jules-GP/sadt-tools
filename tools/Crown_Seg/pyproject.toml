[project]
name = "sadt-crownseg"
version = "0.1.0"
description = "Label every tooth of an intraoral scan with its dental number."
# The deployment image's interpreter (lab-ai:2026.08, python 3.11.13), and the
# only one pytorch3d is built for there.
requires-python = ">=3.11,<3.12"
# Everything the tool needs EXCEPT the segmentation engine. Kept apart on
# purpose -- see the extra below and README.md.
dependencies = [
    "torch==2.8.0",
    "vtk==9.6.2",
    "numpy==2.3.2",
]

# The engine. It is an extra rather than a dependency because shapeaxi requires
# pytorch3d, which publishes no wheel for this Python and has to be compiled
# from source against the pinned torch -- tens of minutes and a CUDA toolkit.
# A plain `uv sync` therefore stays fast and CI can still import the package and
# publish its schema; `uv sync --extra segmentation` builds the real thing.
[project.optional-dependencies]
segmentation = ["shapeaxi==2.0.2", "pytorch3d"]

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_crownseg"]

# `explicit` is load-bearing: without it uv looks for EVERY package on the
# PyTorch index, and most of them are not there.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Development only: lets this tool's tests run ANOTHER tool through that tool's
# own venv, as a subprocess, the way the server does. It has no dependencies of
# its own, so it cannot perturb the resolution above. Never move it into
# [project] dependencies -- see testkit/README.md.
sadt-testkit = { path = "../../testkit", editable = true }
torch = { index = "pytorch-cu128" }
# pytorch3d has no usable PyPI distribution: the newest release there is 0.7.4
# with wheels for cp38-cp310 only, built against a torch generations older than
# ours. The tag is what the deployment image already compiles.
#
# It is listed in the extra ABOVE as a direct dependency even though shapeaxi
# pulls it transitively, because `tool.uv.sources` only applies to direct
# dependencies -- left transitive, uv ignores this source and fails with
# "no wheels with a matching Python version tag".
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", tag = "v0.7.9" }

# pytorch3d's setup.py imports torch at build time and does not declare it, so
# under uv's build isolation it fails with ModuleNotFoundError: torch. This puts
# torch into its isolated build environment, which is what makes the lock
# resolvable at all. `no-build-isolation-package` does NOT work here: it stops
# uv from providing torch rather than making it available.
[tool.uv.extra-build-dependencies]
pytorch3d = ["torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device. Skipped in CI (`-m 'not gpu'`); run it by hand and report the result in the PR.",
    "models: needs the real checkpoint and the `segmentation` extra. See tests/data/README.md.",
]
