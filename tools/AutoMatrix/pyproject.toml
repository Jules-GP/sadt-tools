[project]
name = "sadt-automatrix"
version = "0.1.0"
description = "Apply an existing registration matrix to a cohort of scans or landmarks."
# 3.11 is the deployment image's interpreter (lab-ai:2026.08, python 3.11.13),
# and nothing here constrains it further: this tool is transform geometry over
# SimpleITK, with no torch anywhere in it.
requires-python = ">=3.11,<3.12"
# Upstream's CLI imports exactly one third-party module, SimpleITK, and gets it
# from Slicer's own environment with no version stated anywhere. Pinned here to
# the version every sibling tool locks, so a matrix read by AREG and applied by
# AutoMatrix goes through one ITK, not two.
dependencies = [
    "SimpleITK==2.5.6",
]

# What makes this directory a tool. A directory holding a pyproject.toml
# WITHOUT this section -- the testkit -- is a plain package: importable,
# installable, never discovered or served.
[tool.sadt]
tool = true
# The API identity: what a client sends, what deployment.toml is keyed by, and
# what another tool would pass to `sup.run()`.
name = "AutoMatrix"

[dependency-groups]
# numpy is a TEST dependency and deliberately not a runtime one: the tool never
# touches an array, and the tests need one only to build the synthetic volumes
# they then assert on.
dev = ["pytest==8.3.4", "numpy==2.3.2", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_automatrix"]

[tool.uv.sources]
# Development only: lets this tool's tests run ANOTHER tool through that tool's
# own venv, as a subprocess, the way the server does. It has no dependencies of
# its own, so it cannot perturb the resolution above. Never move it into
# [project] dependencies -- see testkit/README.md.
sadt-testkit = { path = "../../testkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device. Skipped in CI (`-m 'not gpu'`); run it by hand and report the result in the PR.",
]
