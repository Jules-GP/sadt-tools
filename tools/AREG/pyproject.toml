[project]
name = "sadt-areg"
version = "0.1.0"
description = "Register a follow-up scan onto its baseline, so the two can be compared."
# The deployment image's interpreter (lab-ai:2026.08, python 3.11.13), and the
# only one pytorch3d is built for there.
requires-python = ">=3.11,<3.12"
# The CBCT engine's stack, plus VTK for the meshes. Pinned to what the deployed
# server runs and what every sibling tool already locks.
dependencies = [
    "torch==2.8.0",
    "monai==1.6.0",
    "itk==5.4.7",
    # elastix is reached as `itk.ElastixRegistrationMethod`, which plain itk
    # does not carry -- this is the package that adds it, and the CBCT engine is
    # nothing without it.
    "itk-elastix==0.23.0",
    "SimpleITK==2.5.6",
    "numpy==2.3.2",
    "vtk==9.6.2",
    "dicom2nifti==2.6.2",
]

# The IOS engine's renderer, behind an extra for the same reason as ALI's and
# Crown_Seg's: pytorch3d publishes no usable wheel and compiles from source
# against the pinned torch. A plain `uv sync` stays fast, CI can still import the
# package and publish its schema, and the CBCT engine works without it.
[project.optional-dependencies]
ios = ["pytorch3d"]

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_areg"]

# `explicit` is load-bearing: without it uv looks for EVERY package on the
# PyTorch index, and most of them are not there.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Development only: lets this tool's tests run ANOTHER tool through that tool's
# own venv, as a subprocess, the way the server does -- which is how the
# supervisor is exercised end to end. It has no dependencies of its own, so it
# cannot perturb the resolution above. Never move it into [project]
# dependencies -- see testkit/README.md.
sadt-testkit = { path = "../../testkit", editable = true }
torch = { index = "pytorch-cu128" }
# Same tag ALI and Crown_Seg pin, so the three share one build.
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", tag = "v0.7.9" }

# pytorch3d's setup.py imports torch at build time and does not declare it, so
# under uv's build isolation it fails with ModuleNotFoundError: torch.
[tool.uv.extra-build-dependencies]
pytorch3d = ["torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device. Skipped in CI (`-m 'not gpu'`); run it by hand and report the result in the PR.",
    "models: needs a real model bundle and is skipped without it. See tests/data/README.md.",
    "ios: needs the `ios` extra (pytorch3d compiled). Skipped without it.",
]
