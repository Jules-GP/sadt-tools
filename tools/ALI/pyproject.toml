[project]
name = "sadt-ali"
version = "0.1.0"
description = "Place anatomical landmarks on a CBCT scan or an intraoral scan."
# The deployment image's interpreter (lab-ai:2026.08, python 3.11.13), which is
# where every ALI result to date was produced -- and the only one pytorch3d is
# built for there.
requires-python = ">=3.11,<3.12"
# Everything the CBCT engine needs, plus VTK for reading intraoral meshes.
# Pinned to the stack the deployed server actually runs; see README.
dependencies = [
    "torch==2.8.0",
    "monai==1.6.0",
    "itk==5.4.7",
    "SimpleITK==2.5.6",
    "numpy==2.3.2",
    # The IOS engine reads and locates points on meshes with it. A hard
    # dependency rather than an extra: it is a wheel, it is small next to
    # torch, and `surface.import_vtk()` guarding it was there for a shared
    # image that could be missing it. The lockfile guarantees what that could
    # not.
    "vtk==9.6.2",
]

# The IOS engine's renderer. An extra rather than a dependency because
# pytorch3d publishes no usable wheel and is compiled from source against the
# pinned torch -- tens of minutes and a CUDA toolkit. A plain `uv sync`
# therefore stays fast, CI can still import the package and publish its schema,
# and the CBCT engine works without it. `render.import_pytorch3d()` raises
# ToolUnavailableError naming the command to run.
[project.optional-dependencies]
ios = ["pytorch3d"]

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_ali"]

# `explicit` is load-bearing: without it uv looks for EVERY package on the
# PyTorch index, and most of them are not there.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Development only: lets this tool's tests run ANOTHER tool through that tool's
# own venv, as a subprocess, the way the server does. It has no dependencies of
# its own, so it cannot perturb the resolution above. Never move it into
# [project] dependencies -- see testkit/README.md.
sadt-testkit = { path = "../../testkit", editable = true }
torch = { index = "pytorch-cu128" }
# pytorch3d has no usable PyPI distribution: the newest release there is 0.7.4
# with wheels for cp38-cp310 only, built against a torch generations older than
# ours. The tag is the one Crown_Seg pins and the deployment image already
# compiles, so the two tools share one build.
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", tag = "v0.7.9" }

# pytorch3d's setup.py imports torch at build time and does not declare it, so
# under uv's build isolation it fails with ModuleNotFoundError: torch. This puts
# torch into its isolated build environment, which is what makes the lock
# resolvable at all. `no-build-isolation-package` does NOT work here: it stops
# uv from providing torch rather than making it available.
[tool.uv.extra-build-dependencies]
pytorch3d = ["torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device. Skipped in CI (`-m 'not gpu'`); run it by hand and report the result in the PR.",
    "models: needs a real model bundle and is skipped without it. See tests/data/README.md.",
    "ios: needs the `ios` extra (pytorch3d compiled). Skipped without it.",
]
