[project]
name = "sadt-ali-common"
version = "0.1.0"
description = "What ALI's two engines must not disagree about: the markups output format."
# The lowest either engine pins, so neither is constrained by this package.
requires-python = ">=3.9"
# Deliberately empty, and it must stay that way. This is installed into BOTH
# ALI_CBCT's and ALI_IOS's environments, whose whole reason for being separate
# is that their pins are incompatible -- ALI_IOS needs torch 2.11 for pytorch3d
# while ALI_CBCT has no reason to move. A dependency here would have to be
# satisfiable by both at once, which is exactly the constraint the split
# removed. `markups.py` imports `json` and `os`; that is the budget.
dependencies = []

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_ali_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
