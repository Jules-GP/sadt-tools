[project]
name = "sadt-testkit"
version = "0.1.0"
description = "Run one tool from another tool's tests, through its own venv. Development only."
requires-python = ">=3.9"
# Deliberately empty, and it must stay that way. This is installed into every
# tool's DEV environment; anything it pulled in could perturb the resolution of
# the tool it is helping to test, which is the one thing this repository exists
# to prevent.
dependencies = []

# Dev only, and never installed into a tool venv: a tool depends on this
# package, not on its dev group. numpy is here because the tests write the .npy
# fixtures that tools/_template reads -- written with this numpy, read with the
# tool's, which is exactly the separation being tested.
[dependency-groups]
dev = ["pytest==8.3.4", "numpy==1.26.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_testkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
